[project]
name = "prism"
version = "0.1.0"
description = "Split a PR diff into what needs human review and what can be handed to a model."
readme = "README.md"
authors = [
    { name = "Jarek", email = "9482128+xawt@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
prism = "prism.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ty.terminal]
error-on-warning = true
